# Redunar's current release target is x86_64 Linux. Keep the license graph
# aligned with the artifacts we actually distribute instead of accepting
# dependencies that are reachable only on unsupported hosts.
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
