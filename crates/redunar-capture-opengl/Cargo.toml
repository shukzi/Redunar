[package]
name = "redunar-capture-opengl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
launch-diagnostics = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nix = { version = "0.29", default-features = false, features = ["fs", "socket", "uio"] }
redunar-capture = { path = "../redunar-capture" }
redunar-core = { path = "../redunar-core" }

# OpenGL interception is a native ABI boundary. Keep unsafe code isolated in
# this crate and require explicit safety reasoning at every operation.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
