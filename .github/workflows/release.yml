name: Redunar release
# Qualification happens before publication. A published release never triggers a build.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing approved tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      publish:
        description: Publish after qualification and release-environment approval
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  candidate:
    name: Qualify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an integrated release tag
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH: ${{ inputs.publish }}
          PUBLICATION_ENABLED: ${{ vars.REDUNAR_RELEASE_PUBLICATION_ENABLED }}
        run: |
          if [[ "$PUBLISH" == true && "$PUBLICATION_ENABLED" != true ]]; then
            printf '%s\n' 'Configure and approve the release environment before enabling publication.' >&2
            exit 1
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          tools/check-release-inputs.sh "$RELEASE_TAG"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
      - name: Bootstrap compatibility image
        run: |
          podman build --pull=always --network=host \
            --tag localhost/redunar-build-glibc-2.36:bookworm \
            --file packaging/build-images/glibc-2.36.Containerfile \
            packaging/build-images
      - name: Validate and prepare unsigned packages
        id: prepare
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tools/prepare-release.sh "$RELEASE_TAG"
          printf 'assets=%s/.redunar-build/candidates/%s-%s\n' "$GITHUB_WORKSPACE" "$RELEASE_TAG" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.run_id }}
          path: ${{ steps.prepare.outputs.assets }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.run_id }}
          path: .redunar-build/reports/
          include-hidden-files: true
          retention-days: 30
  publish:
    name: Sign and publish approved candidate
    needs: candidate
    if: ${{ inputs.publish && vars.REDUNAR_RELEASE_PUBLICATION_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Configure required maintainer review and keep the signing secret here, not
    # in repository-wide secrets. See docs/RELEASING.md before enabling.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ github.run_id }}
          path: candidate
      - name: Check candidate identity and release notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.candidate.outputs.commit }}
        run: |
          test "$(cat candidate/SOURCE_COMMIT)" = "$SOURCE_COMMIT"
          test "$(cat candidate/RELEASE_TAG)" = "$RELEASE_TAG"
          test "$(cat candidate/VERSION)" = "${RELEASE_TAG#v}"
          test -s "docs/releases/$RELEASE_TAG.md"
          (cd candidate; sha256sum --check ./*.sha256)
      - name: Sign and verify packages
        env:
          REDUNAR_RELEASE_SIGNING_KEY: ${{ secrets.REDUNAR_RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/redunar-release-private.pem"
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s' "$REDUNAR_RELEASE_SIGNING_KEY" >"$key_file"
          tools/sign-release-assets.sh "$GITHUB_WORKSPACE/candidate" "$key_file"
          (cd candidate; sha256sum --check SHA256SUMS)
      - name: Publish the reviewed release notes and qualified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" \
            candidate/redunar-app-linux-* candidate/VERSION \
            candidate/SHA256SUMS candidate/SHA256SUMS.sig
