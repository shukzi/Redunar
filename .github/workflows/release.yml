name: Redunar release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and verify release assets
    runs-on: ubuntu-24.04
    steps:
      - name: Check release inputs
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Build Linux packages
        env:
          CARGO_TERM_COLOR: always
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman rpm zstd
          cd output/tauri-redunar
          npm ci
          cd ../..
          mkdir -p local-builds/node_modules
          cargo fetch --manifest-path Cargo.toml
          test "${RELEASE_TAG#v}" = "$(awk '$1 == \"Version:\" { print $2; exit }' packaging/redunar-app.spec)"
          assets="$RUNNER_TEMP/install-assets"
          mkdir -p "$assets"
          tools/build-linux-release.sh
          tools/build-tauri-deb.sh "$assets"
          tools/build-tauri-arch-package.sh "$assets"
          tools/build-tauri-opensuse-rpm.sh "$assets"
          rpm_assets="$RUNNER_TEMP/rpm-assets"
          mkdir -p "$rpm_assets"
          tools/build-local-tauri-rpm.sh "$rpm_assets"
          cp "$rpm_assets/redunar-app.rpm" "$assets/redunar-app-linux-x86_64.rpm"
          tools/build-tauri-portable.sh "$assets"
          for asset in "$assets"/redunar-app-linux-*; do
            sha256sum "$asset" >"$asset.sha256"
          done

      - name: Sign release manifest
        env:
          REDUNAR_RELEASE_SIGNING_KEY: ${{ secrets.REDUNAR_RELEASE_SIGNING_KEY }}
        run: |
          key_file="$RUNNER_TEMP/redunar-release-private.pem"
          printf '%s' "$REDUNAR_RELEASE_SIGNING_KEY" >"$key_file"
          tools/sign-release-assets.sh \
            "$RUNNER_TEMP/install-assets" \
            "$key_file"
          rm -f "$key_file"

      - name: Verify release assets
        run: |
          openssl pkey \
            -pubin \
            -in packaging/release-signing-public.pem \
            -noout
          openssl dgst -sha256 \
            -verify packaging/release-signing-public.pem \
            -signature "$RUNNER_TEMP/install-assets/SHA256SUMS.sig" \
            "$RUNNER_TEMP/install-assets/SHA256SUMS"
          (cd "$RUNNER_TEMP/install-assets" && sha256sum -c SHA256SUMS)

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/install-assets"/* \
            --clobber
