<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Redunar</title><link rel="icon" href="assets/redunar-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="native.css"><link rel="stylesheet" href="workspace-sizing.css"><link rel="stylesheet" href="replay-editor.css"><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="controls.css"><link rel="stylesheet" href="precision-sliders.css"><link rel="stylesheet" href="precision-selects.css"><link rel="stylesheet" href="history-chart.css"><link rel="stylesheet" href="workspace-feedback.css"><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="steam-setup.css"><link rel="stylesheet" href="workspace-improvements.css"><link rel="stylesheet" href="replay-layout.css"><link rel="stylesheet" href="clip-browser.css"><link rel="stylesheet" href="capture-status.css">
  <link rel="stylesheet" href="navigation-shell.css"><link rel="stylesheet" href="workspace-refinements.css"><link rel="stylesheet" href="workspace-motion.css"><link rel="stylesheet" href="workspace-polish.css"><link rel="stylesheet" href="audio-controls.css"><link rel="stylesheet" href="workspace-theme.css"><link rel="stylesheet" href="history-workspace.css"><link rel="stylesheet" href="choice-switchers.css"><link rel="stylesheet" href="toggle-controls.css"><link rel="stylesheet" href="dialogs.css"><link rel="stylesheet" href="icon-motion.css"><link rel="stylesheet" href="toasts.css"><link rel="stylesheet" href="refresh-feedback.css"><script type="module" src="app.js"></script></head>
<body>
  <div class="window-titlebar" data-tauri-drag-region aria-label="Window controls">
    <div class="window-drag-region" data-tauri-drag-region></div>
    <button type="button" class="window-control" data-window-action="minimize" aria-label="Minimize window" title="Minimize"><span data-ui-icon="minus" class=""></span></button>
    <button type="button" class="window-control" data-window-action="maximize" aria-label="Maximize or restore window" title="Maximize or restore"><span data-ui-icon="square" class=""></span></button>
    <button type="button" class="window-control window-close" data-window-action="close" aria-label="Close window" title="Close"><span data-ui-icon="x" class=""></span></button>
  </div>
  <div class="window-resize window-resize-n" data-resize-direction="North"></div>
  <div class="window-resize window-resize-ne" data-resize-direction="NorthEast"></div>
  <div class="window-resize window-resize-e" data-resize-direction="East"></div>
  <div class="window-resize window-resize-se" data-resize-direction="SouthEast"></div>
  <div class="window-resize window-resize-s" data-resize-direction="South"></div>
  <div class="window-resize window-resize-sw" data-resize-direction="SouthWest"></div>
  <div class="window-resize window-resize-w" data-resize-direction="West"></div>
  <div class="window-resize window-resize-nw" data-resize-direction="NorthWest"></div>
  <div class="window-content">
  <a class="skip-link" href="#workspace">Skip to workspace</a>
  <aside class="sidebar">
    <a class="brand" href="#overview" aria-label="Redunar overview"><img class="brand-mark" src="assets/redunar-logo.svg" width="34" height="34" alt=""><span class="brand-copy"><img class="brand-wordmark" src="assets/redunar-wordmark.png" width="122" height="13" alt="Redunar"></span></a>
    <nav aria-label="App navigation" id="navigation"></nav>
<div class="sidebar-bottom"><button type="button" class="sidebar-toggle" data-sidebar-toggle aria-controls="navigation" aria-expanded="true" aria-label="Collapse sidebar"><span data-ui-icon="sidebar" class="sidebar-collapse-icon"></span><span>Collapse sidebar</span></button><a class="settings-link" href="#settings" aria-label="Settings"><span data-ui-icon="settings" class=""></span><span class="settings-label">Settings</span><span class="build-label">Version __REDUNAR_VERSION__</span></a></div>
  </aside>
  <div class="app-shell"><main id="workspace" tabindex="-1"></main></div>
  </div>
  <div id="toast" class="toast-viewport" role="region" aria-label="Notifications" hidden></div>
  <dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2></div><p id="dialog-error" class="dialog-error" role="alert" tabindex="-1" hidden></p><div id="dialog-body"></div></dialog>
</body></html>
