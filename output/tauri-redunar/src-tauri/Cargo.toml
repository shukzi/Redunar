[package]
name = "redunar-tauri"
version = "0.1.27"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
redunar-capture-audio = { path = "../../../crates/redunar-capture-audio" }
redunar-daemon = { path = "../../../crates/redunar-daemon" }
redunar-core = { path = "../../../crates/redunar-core" }
redunar-platform = { path = "../../../crates/redunar-platform" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libc = "0.2"
webkit2gtk = "2.0.2"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[workspace]
